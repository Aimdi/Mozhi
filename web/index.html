<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A fast, private translator: use your own Mozhi instance or AI model (OpenAI, Anthropic, Gemini, Ollama, ...) with Kagi-style alternatives, insights and proofreading.">
  <meta name="theme-color" content="#3F51B5">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mozhi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mozhi</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash shown until Flutter draws its first frame (no external
       resources; follows the system light/dark preference). -->
  <style>
    :root { --splash-bg: #fbf8ff; --splash-fg: #1b1b21; --splash-accent: #3f51b5; --splash-track: #e0e0f0; }
    @media (prefers-color-scheme: dark) {
      :root { --splash-bg: #121318; --splash-fg: #e4e1e9; --splash-accent: #bac3ff; --splash-track: #2e3040; }
    }
    html, body { margin: 0; height: 100%; background: var(--splash-bg); }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: var(--splash-bg); color: var(--splash-fg);
      font: 500 20px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 200ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .spinner {
      width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%;
      border: 4px solid var(--splash-track); border-top-color: var(--splash-accent);
      animation: splash-spin 900ms linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .spinner { animation-duration: 3s; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-busy="true" aria-label="Loading Mozhi">
    <div class="spinner"></div>
    <div>Mozhi</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 250);
    }, { once: true });
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
