name: mlkit_translator
description: Offline on-device translation for Mozhi using Google ML Kit (Android and iOS).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_language_id: ^0.15.1
  google_mlkit_translation: ^0.15.1
  translation_repository:
    path: ../translation_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
