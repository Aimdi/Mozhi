name: llama_engine
description: On-device AI for Mozhi with llama.cpp (no Google services).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
  assets:
    - assets/models.json
