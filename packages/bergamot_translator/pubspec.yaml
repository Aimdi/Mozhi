name: bergamot_translator
description: Offline on-device translation for Mozhi with Mozilla's open Firefox Translations (Bergamot) models.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.16.0
  path: ^1.9.1
  translation_repository:
    path: ../translation_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
  assets:
    - assets/catalog.json
