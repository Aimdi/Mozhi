include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml
analyzer:
  exclude:
    - lib/l10n/gen/*
    - build/**
    - android/**
    - web/**
    # Play-variant overlay (tool/play_prepare.sh copies it into lib/ and
    # test/); it imports google_mlkit_text_recognition, which only that
    # variant depends on. The Play CI job analyzes it in place.
    - tool/play/**
linter:
  rules:
    public_member_api_docs: false
