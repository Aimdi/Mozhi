name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  # The release's web zip is built for the root of a web server. To serve it
  # from a sub-path, change <base href> in its index.html (e.g. "/mozhi/").
  WEB_BASE_HREF: /
  # The offline engine (packages/bergamot_translator) is C++ built by the
  # Android jobs. Keep in sync with packages/bergamot_translator/android/
  # build.gradle and .github/workflows/main.yaml.
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  # The default build: no Google code; offline translation with Mozilla's
  # Bergamot engine (compiled here for the three ABIs). Every APK and the
  # app bundle must pass tool/check_no_google.sh.
  android:
    name: Build Android APKs and app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # CMake (>= 3.17) reads the compiler launcher from the environment, so
      # the plugin's Gradle externalNativeBuild compiles through ccache.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned sources of every on-device engine (translation, text
      # recognition, voice), then their patches.
      - name: Fetch the on-device engines' sources
        run: bash tool/fetch_native_deps.sh

      - name: Install the NDK, CMake and ccache
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          sudo apt-get install -y -q ccache > /dev/null

      # Warm from the CI runs on the branches (same sources).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bergamot-ccache-${{ env.NDK_VERSION }}-release-default-${{ github.sha }}
          restore-keys: |
            bergamot-ccache-${{ env.NDK_VERSION }}-default-
            bergamot-ccache-${{ env.NDK_VERSION }}-

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '"'\''\r')
          if [ "v${version%%+*}" != "$TAG" ]; then
            echo "::warning::Tag $TAG does not match pubspec.yaml version $version."
          fi

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Without these secrets the APKs are signed with a throwaway debug key.
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release is signed with a debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          set -o pipefail
          # Obfuscated Dart code; the symbols needed to read stack traces
          # (`flutter symbolize`) go to build/symbols and are uploaded as a
          # private workflow artifact, not attached to the release.
          # One APK per ABI (smaller downloads).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart --split-per-abi \
            --obfuscate --split-debug-info=build/symbols/apk-split-per-abi \
            2>&1 | tee build-android.log
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-production-release.apk" "dist/mozhi-$TAG-$abi.apk"
          done

          # Universal APK (all ABIs).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart \
            --obfuscate --split-debug-info=build/symbols/apk-universal \
            2>&1 | tee -a build-android.log
          cp "$out/app-production-release.apk" "dist/mozhi-$TAG-universal.apk"

          ls -lh dist
          ccache --show-stats || true

      # Android App Bundle for Google Play (upload it with the keystore above
      # as the upload key; see docs/store/README.md).
      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          flutter build appbundle --release --flavor production \
            -t lib/main_production.dart \
            --obfuscate --split-debug-info=build/symbols/aab \
            2>&1 | tee -a build-android.log
          cp build/app/outputs/bundle/productionRelease/app-production-release.aab \
            "dist/mozhi-$TAG.aab"
          ls -lh dist

      # The release must not contain ML Kit, Play services, Firebase or
      # data transport code (classes or ML Kit native libraries/models).
      - name: Check the APKs and the app bundle have no Google code
        run: |
          for file in dist/*.apk dist/*.aab; do
            sh tool/check_no_google.sh "$file"
          done

      - name: Check the on-device engines are in the APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          apk="dist/mozhi-$TAG-universal.apk"
          entries=$(unzip -l "$apk")
          failed=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for engine in bergamot tesseract whisper; do
              if ! grep -q "lib/$abi/libmozhi_$engine\.so" <<< "$entries"; then
                echo "::error::$apk has no lib/$abi/libmozhi_$engine.so"
                failed=1
              fi
            done
          done
          if grep -q 'libc++_shared\.so' <<< "$entries"; then
            echo "::error::$apk contains libc++_shared.so"
            failed=1
          fi
          [ "$failed" = 0 ]

      - name: Summarize native build errors
        if: failure()
        run: |
          [ -f build-android.log ] || exit 0
          {
            echo "### Native build errors"
            echo
            echo '```text'
            grep -E "Execution failed for task|(error|fatal error): |^FAILED: " build-android.log |
              sort -u | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 7

      # Dart debug symbols of the obfuscated builds, one folder per build
      # (`flutter symbolize -i <stack trace> -d <folder>/app.android-arm64.symbols`).
      # A workflow artifact only: the publish job downloads `release-*`, so
      # these never reach the public release.
      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-android-${{ github.ref_name }}
          path: build/symbols
          if-no-files-found: error
          retention-days: 90

  web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build
        run: |
          # --no-web-resources-cdn: serve CanvasKit from the build itself
          # instead of Google's CDN (no third-party request on start).
          flutter build web --release -t lib/main_production.dart \
            --base-href "$WEB_BASE_HREF" --no-web-resources-cdn

      - name: Zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          (cd build/web && zip -q -r -9 "$GITHUB_WORKSPACE/dist/mozhi-$TAG-web.zip" .)
          ls -lh dist

      - name: Upload web zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # The Play variant (tool/play_prepare.sh): the default app plus Google ML
  # Kit's on-device text recognition (closed source). Published next to the
  # default APKs as mozhi-<tag>-play-universal.apk; not checked for Google
  # code (it contains ML Kit by design).
  android-play:
    name: Build Play variant APK (ML Kit)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # CMake (>= 3.17) reads the compiler launcher from the environment, so
      # the plugin's Gradle externalNativeBuild compiles through ccache.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The pinned sources of every on-device engine (translation, text
      # recognition, voice), then their patches.
      - name: Fetch the on-device engines' sources
        run: bash tool/fetch_native_deps.sh

      - name: Install the NDK, CMake and ccache
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          sudo apt-get install -y -q ccache > /dev/null

      # Warm from the CI runs on the branches (same sources).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bergamot-ccache-${{ env.NDK_VERSION }}-release-play-${{ github.sha }}
          restore-keys: |
            bergamot-ccache-${{ env.NDK_VERSION }}-play-
            bergamot-ccache-${{ env.NDK_VERSION }}-

      - name: Add ML Kit
        run: |
          sh tool/play_prepare.sh
          git status --short

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the Play variant is signed with a debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          flutter build apk --release --flavor production \
            -t lib/main_production.dart \
            --obfuscate --split-debug-info=build/symbols/apk-play-universal
          cp build/app/outputs/flutter-apk/app-production-release.apk \
            "dist/mozhi-$TAG-play-universal.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android-play
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-android-play-${{ github.ref_name }}
          path: build/symbols
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub release
    needs: [android, android-play, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.apk *.aab *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Release files"
            echo
            echo '```text'
            ls -lh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Mozhi ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            - **Android**: `arm64-v8a` fits almost every modern phone, `armeabi-v7a` old 32-bit devices, `x86_64` emulators and Chromebooks; `universal` works everywhere but is larger. These builds contain no Google code: offline translation uses Mozilla's open Firefox Translations models, text recognition in photos uses Tesseract and offline voice input uses Whisper (their data is downloaded only when you ask for it, or imported from files).
            - **Play variant**: `mozhi-${{ github.ref_name }}-play-universal.apk` uses Google ML Kit's on-device text recognition (closed source, no download needed) instead of Tesseract for camera and image translation; otherwise the same app.
            - **Google Play bundle**: `mozhi-${{ github.ref_name }}.aab` is the Android App Bundle uploaded to Play; it can't be installed directly.
            - **Web**: `mozhi-${{ github.ref_name }}-web.zip` is a static build for the root of any web server (edit `<base href>` in `index.html` to serve it from a sub-path).
            - Verify downloads against `SHA256SUMS.txt`.
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
