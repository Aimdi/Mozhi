name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  # The release's web zip is built for the root of a web server. To serve it
  # from a sub-path, change <base href> in its index.html (e.g. "/mozhi/").
  WEB_BASE_HREF: /

jobs:
  android:
    name: Build Android APKs and app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '"'\''\r')
          if [ "v${version%%+*}" != "$TAG" ]; then
            echo "::warning::Tag $TAG does not match pubspec.yaml version $version."
          fi

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Without these secrets the APKs are signed with a throwaway debug key.
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release is signed with a debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          # Obfuscated Dart code; the symbols needed to read stack traces
          # (`flutter symbolize`) go to build/symbols and are uploaded as a
          # private workflow artifact, not attached to the release.
          # One APK per ABI (smaller downloads).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart --split-per-abi \
            --obfuscate --split-debug-info=build/symbols/apk-split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-production-release.apk" "dist/mozhi-$TAG-$abi.apk"
          done

          # Universal APK (all ABIs).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart \
            --obfuscate --split-debug-info=build/symbols/apk-universal
          cp "$out/app-production-release.apk" "dist/mozhi-$TAG-universal.apk"

          ls -lh dist

      # Android App Bundle for Google Play (upload it with the keystore above
      # as the upload key; see docs/store/README.md).
      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          flutter build appbundle --release --flavor production \
            -t lib/main_production.dart \
            --obfuscate --split-debug-info=build/symbols/aab
          cp build/app/outputs/bundle/productionRelease/app-production-release.aab \
            "dist/mozhi-$TAG.aab"
          ls -lh dist

      - name: Upload APKs and app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 7

      # Dart debug symbols of the obfuscated builds, one folder per build
      # (`flutter symbolize -i <stack trace> -d <folder>/app.android-arm64.symbols`).
      # A workflow artifact only: the publish job downloads `release-*`, so
      # these never reach the public release.
      - name: Upload debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-symbols-android-${{ github.ref_name }}
          path: build/symbols
          if-no-files-found: error
          retention-days: 90

  web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build
        run: |
          # --no-web-resources-cdn: serve CanvasKit from the build itself
          # instead of Google's CDN (no third-party request on start).
          flutter build web --release -t lib/main_production.dart \
            --base-href "$WEB_BASE_HREF" --no-web-resources-cdn

      - name: Zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          (cd build/web && zip -q -r -9 "$GITHUB_WORKSPACE/dist/mozhi-$TAG-web.zip" .)
          ls -lh dist

      - name: Upload web zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [android, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.apk *.aab *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Release files"
            echo
            echo '```text'
            ls -lh
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Mozhi ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            - **Android**: `arm64-v8a` fits almost every modern phone, `armeabi-v7a` old 32-bit devices, `x86_64` emulators and Chromebooks; `universal` works everywhere but is larger.
            - **Google Play bundle**: `mozhi-${{ github.ref_name }}.aab` is the Android App Bundle uploaded to Play; it can't be installed directly.
            - **Web**: `mozhi-${{ github.ref_name }}-web.zip` is a static build for the root of any web server (edit `<base href>` in `index.html` to serve it from a sub-path).
            - Verify downloads against `SHA256SUMS.txt`.
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
