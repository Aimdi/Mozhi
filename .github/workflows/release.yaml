name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Without these secrets the APKs are signed with a throwaway debug key.
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release is signed with a debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          flutter build apk --release --flavor production \
            -t lib/main_production.dart --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-production-release.apk" "dist/mozhi-$TAG-$abi.apk"
          done

          flutter build apk --release --flavor production \
            -t lib/main_production.dart
          cp "$out/app-production-release.apk" "dist/mozhi-$TAG-universal.apk"

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Mozhi ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
