name: ci

on:
  push:
    # Branches only: tag pushes are handled by release.yaml.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled, except on the default branch, where every
  # push is tested.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  # The web build (artifact mozhi-web) is served from the root of a web
  # server. To host it under a sub-path, set the repository variable
  # WEB_BASE_HREF (for example "/app/").
  WEB_BASE_HREF: ${{ vars.WEB_BASE_HREF || '/' }}

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          bash .github/scripts/packages.sh get

      # lib/l10n/gen is not committed. Untranslated messages in non-English
      # ARB files are only reported (they fall back to English), never fatal.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          roots=()
          for dir in lib test packages tool; do
            if [ -d "$dir" ]; then roots+=("$dir"); fi
          done
          find "${roots[@]}" -name '*.dart' \
            -not -path 'lib/l10n/gen/*' \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -not -name '*.g.dart' \
            -print0 | xargs -0 -r dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Bloc lint
        run: dart run bloc_tools:bloc lint lib

      # Every package under packages/ (llm_api, mlkit_translator, mozhi_api,
      # mozhi_cli, mt_api, translation_repository): pure Dart packages and
      # the CLI use dart test, Flutter packages (mlkit_translator) flutter
      # test. Packages without tests are skipped.
      - name: Test packages
        run: bash .github/scripts/packages.sh test

      - name: Test app
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android APKs
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Optional: without these secrets the release APKs are signed with the
      # debug key (fine for testing, but they cannot update each other).
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          # One APK per ABI (smaller downloads).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-production-release.apk" "dist/mozhi-$abi.apk"
          done

          # Universal APK (all ABIs).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart
          cp "$out/app-production-release.apk" dist/mozhi-universal.apk

          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Size report
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            signing="release key"
          else
            signing="debug key (no signing secrets)"
          fi
          {
            echo "### Android APKs"
            echo
            echo "Signed with the $signing."
            echo
            echo "| APK | Size |"
            echo "| --- | ---: |"
            for apk in dist/*.apk; do
              size=$(numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c %s "$apk")")
              echo "| \`$(basename "$apk")\` | $size |"
            done
            echo
            echo '```text'
            ls -lh dist
            echo
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mozhi-android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # The F-Droid variant: the same app without Google ML Kit (closed source),
  # prepared by tool/fdroid_prepare.sh exactly as the F-Droid recipe does.
  # Keeps that build compiling and proves the APK has no ML Kit code.
  build-fdroid:
    name: Build F-Droid variant (no ML Kit)
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Edits this job's checkout only (pubspec.yaml, lib/platform bindings,
      # ML Kit files, android/app/build.gradle.kts, android/gradle.properties).
      - name: Strip ML Kit
        run: |
          sh tool/fdroid_prepare.sh
          sh tool/fdroid_prepare.sh # idempotent: a second run only checks
          git status --short

      - name: Install dependencies
        run: |
          flutter pub get
          bash .github/scripts/packages.sh get
          flutter gen-l10n
          if grep -n 'mlkit' pubspec.lock; then
            echo "::error::pubspec.lock still resolves an ML Kit package"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: |
          flutter build apk --release --flavor production \
            -t lib/main_production.dart --android-project-arg=noMlkit=true
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-production-release.apk \
            dist/mozhi-fdroid-universal.apk

      - name: Check the APK has no ML Kit
        run: |
          apk=dist/mozhi-fdroid-universal.apk
          work="$RUNNER_TEMP/apk"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q -o "$apk" -d "$work"
          failed=0

          # ML Kit's classes (R8 keeps their names: ML Kit ships keep rules
          # and the native code looks them up by name).
          if grep -l -a 'Lcom/google/mlkit/' "$work"/classes*.dex; then
            echo "::error::$apk contains com/google/mlkit classes"
            failed=1
          fi
          # ML Kit's native libraries and bundled models.
          if unzip -l "$apk" | grep -i -E 'mlkit|translate_jni|language_id|text_recognition'; then
            echo "::error::$apk contains ML Kit native libraries or models"
            failed=1
          fi
          # Independent of R8: nothing in the runtime classpath may come from
          # com.google.mlkit (the Gradle build also excludes the group).
          if [ -x android/gradlew ]; then
            deps=$(cd android && ./gradlew -q :app:dependencies \
              --configuration productionReleaseRuntimeClasspath -PnoMlkit=true)
            if printf '%s\n' "$deps" | grep 'com.google.mlkit'; then
              echo "::error::the Gradle runtime classpath contains ML Kit"
              failed=1
            fi
            # Reported, not fatal: other Google artifacts F-Droid's scanner
            # may flag.
            printf '%s\n' "$deps" |
              grep -E 'com\.google\.(android\.gms|android\.datatransport|firebase|android\.play)' |
              sed 's/^/::warning::Google artifact in the classpath: /' || true
          else
            echo "::warning::android/gradlew missing: dependency check skipped"
          fi
          [ "$failed" = 0 ] || exit 1

          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          {
            echo "### F-Droid variant (no ML Kit)"
            echo
            echo "No ML Kit classes, libraries or dependencies found."
            echo
            echo '```text'
            ls -lh dist
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mozhi-android-fdroid
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-web:
    name: Build web
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build
        run: |
          # --no-web-resources-cdn: serve CanvasKit from the build itself
          # instead of Google's CDN (no third-party request on start).
          flutter build web --release -t lib/main_production.dart \
            --base-href "$WEB_BASE_HREF" --no-web-resources-cdn
          {
            echo "### Web build"
            echo
            echo "Base href \`$WEB_BASE_HREF\`, total size $(du -sh build/web | cut -f1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mozhi-web
          path: build/web
          if-no-files-found: error

  # Browser end-to-end tests (e2e/, Playwright + Chromium) against a web
  # build of the development flavor served from /, with e2e/mock_server.py
  # standing in for a Mozhi instance and an AI provider. Playwright starts
  # both servers itself (python3 -m http.server and the mock; see
  # e2e/playwright.config.js).
  e2e-web:
    name: Web end-to-end tests
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WEB_DIR: ../build/web-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build web (development flavor)
        run: |
          flutter build web --release -t lib/main_development.dart \
            --no-web-resources-cdn --base-href / -o build/web-e2e

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
