name: ci

on:
  push:
    # Branches only: tag pushes are handled by release.yaml.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled, except on the default branch, where every
  # push is tested.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  # The web build (artifact mozhi-web) is served from the root of a web
  # server. To host it under a sub-path, set the repository variable
  # WEB_BASE_HREF (for example "/app/").
  WEB_BASE_HREF: ${{ vars.WEB_BASE_HREF || '/' }}
  # The offline engine (packages/bergamot_translator) is C++ built by every
  # Android job. Keep in sync with ndkVersion and the CMake version in
  # packages/bergamot_translator/android/build.gradle (= Flutter's default
  # NDK, also used by the app).
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          bash .github/scripts/packages.sh get

      # lib/l10n/gen is not committed. Untranslated messages in non-English
      # ARB files are only reported (they fall back to English), never fatal.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          roots=()
          for dir in lib test packages tool; do
            if [ -d "$dir" ]; then roots+=("$dir"); fi
          done
          find "${roots[@]}" -name '*.dart' \
            -not -path 'lib/l10n/gen/*' \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -not -name '*.g.dart' \
            -print0 | xargs -0 -r dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Bloc lint
        run: dart run bloc_tools:bloc lint lib

      # packages/llama_engine's native tests run the real engine: the host
      # build of libmozhi_llama.so (tool/build_native_linux.sh; about a
      # minute with a warm ccache) and its tiny test models
      # (tool/make_test_model.py: llama.cpp's gguf-py, which needs numpy).
      - name: Fetch the on-device AI engine's sources
        run: bash packages/llama_engine/tool/fetch_native_deps.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache-llama
          key: llama-linux-ccache-${{ github.sha }}
          restore-keys: |
            llama-linux-ccache-

      - name: Build the on-device AI engine and its test models
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-llama
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "true"
          CCACHE_MAXSIZE: 500M
        run: |
          # numpy (gguf-py's only dependency) from Ubuntu's signed archive,
          # not an unpinned PyPI download: this job saves the caches that
          # release builds restore.
          sudo apt-get install -y -q ccache ninja-build python3-numpy > /dev/null
          bash packages/llama_engine/tool/build_native_linux.sh
          /usr/bin/python3 packages/llama_engine/tool/make_test_model.py \
            --all packages/llama_engine/build/test_models
          /usr/bin/python3 packages/llama_engine/tool/make_test_model_test.py
          ccache --show-stats || true

      # Every package under packages/ (bergamot_translator, llama_engine,
      # llm_api, mlkit_translator, mozhi_api, mozhi_cli, mt_api,
      # translation_repository): pure Dart packages and the CLI use dart
      # test, Flutter packages (bergamot_translator, mlkit_translator)
      # flutter test. bergamot_translator's real-engine tests are skipped
      # without BERGAMOT_TEST_MODELS=1, so no native library is needed here;
      # llama_engine's use the library and models built above.
      # Packages without tests are skipped.
      - name: Test packages
        run: bash .github/scripts/packages.sh test

      # tool/play_prepare.sh and tool/fdroid_prepare.sh on scratch copies
      # (idempotent, fail loudly), the APK checkers (Google code, trackers)
      # on synthetic APKs, and the model mirror tool against a local
      # fixture server.
      - name: Test build scripts
        run: |
          sh tool/variant_prepare_test.sh
          sh tool/check_no_google_test.sh
          sh tool/install_native_toolchain_test.sh
          python3 tool/check_trackers_test.py
          python3 tool/check_keystore_test.py
          python3 tool/check_signing_test.py
          python3 tool/check_page_size_test.py
          python3 tool/mirror_models_test.py
          python3 tool/llm_catalog_test.py
          python3 tool/whisper_catalog_test.py
          python3 tool/check_public_instances_test.py
          python3 tool/android_smoke_test.py
          python3 tool/dictionary_packs_test.py
          python3 tool/phrasebooks_test.py
          python3 tool/check_coverage_markers_test.py
          # The web app shell's manifest, and that mozhi_sw.js reads it
          # (with Node.js).
          python3 tool/web_shell_manifest_test.py
          # A misplaced coverage marker makes `--coverage` hang (see the
          # script): fail here instead.
          python3 tool/check_coverage_markers.py

      - name: Test app
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The default build: no Google code (no ML Kit, Play services, Firebase or
  # data transport); offline translation with Mozilla's Bergamot engine,
  # compiled here by Gradle for the three ABIs (~25-30 minutes cold, a few
  # minutes with a warm ccache). Every APK must pass tool/check_no_google.sh.
  build-android:
    name: Build Android APKs
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # CMake (>= 3.17) reads the compiler launcher from the environment, so
      # the plugin's Gradle externalNativeBuild compiles through ccache.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned sources of every on-device engine (translation, text
      # recognition, voice): only the submodules they compile, then their
      # patches. The Gradle build compiles them; it downloads nothing.
      - name: Fetch the on-device engines' sources
        run: bash tool/fetch_native_deps.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the NDK, CMake and ccache
        run: |
          # Retries Google's downloads, which sometimes arrive broken.
          bash tool/install_native_toolchain.sh
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Restores the newest cache of any Android job (the same sources).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bergamot-ccache-${{ env.NDK_VERSION }}-default-${{ github.sha }}
          restore-keys: |
            bergamot-ccache-${{ env.NDK_VERSION }}-default-
            bergamot-ccache-${{ env.NDK_VERSION }}-

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Optional: without these secrets the release APKs are signed with the
      # debug key (fine for testing, but they cannot update each other).
      # Without signing secrets the APKs are signed with a debug key. Keep
      # one debug key across runs (GitHub's cache; never published) so a
      # newer test build installs over an older one. Release builds use the
      # release key from the secrets instead.
      - name: Restore the CI debug key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create the CI debug key if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mozhi CI debug,O=Mozhi,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android |
            grep -m1 'SHA256:' | sed 's/^ */Debug key certificate /'

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          python3 tool/check_keystore.py "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          # One APK per ABI (smaller downloads).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart --split-per-abi 2>&1 | tee build-android.log
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-production-release.apk" "dist/mozhi-$abi.apk"
          done

          # Universal APK (all ABIs).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart 2>&1 | tee -a build-android.log
          cp "$out/app-production-release.apk" dist/mozhi-universal.apk

          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          ls -l dist
          ccache --show-stats || true

      - name: Summarize native build errors
        if: failure()
        run: |
          log=build-android.log
          [ -f "$log" ] || exit 0
          {
            echo "### Native build errors"
            echo
            echo "Failed Gradle tasks:"
            echo
            echo '```text'
            grep -E "Execution failed for task|> Task .*(CMake|Cxx).* FAILED" "$log" | sort -u || true
            echo '```'
            echo
            echo "Compiler errors (first 200; the job *Build Bergamot native (Android)* lists all, per ABI):"
            echo
            echo '```text'
            grep -E "(error|fatal error): |^FAILED: " "$log" | sort -u | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails on any class under com/google/mlkit, com/google/android/gms,
      # com/google/firebase or com/google/android/datatransport, and on ML
      # Kit native libraries or models.
      - name: Check the APKs have no Google code
        run: |
          for apk in dist/*.apk; do
            sh tool/check_no_google.sh "$apk"
          done

      # With the signing secrets every APK must carry the release
      # certificate (tool/release-certificate.sha256, as in the README);
      # without them (forks, Dependabot) the debug key's is only printed.
      - name: Check the signing certificate
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            python3 tool/check_signing.py --expect dist/*.apk
          else
            python3 tool/check_signing.py dist/*.apk
          fi

      # The εxodus scan: every class against the code signatures of the
      # trackers εxodus knows (its public list; a warning when it can't be
      # fetched, the Google check above is the hard one).
      - name: Scan the APKs for trackers (εxodus signatures)
        run: python3 tool/check_trackers.py dist/*.apk

      # The engine as shipped (stripped by Gradle): every ABI is in the
      # universal APK and libc++ is linked statically (no libc++_shared.so).
      # Exports and dependencies are checked by the job "Build Bergamot
      # native (Android)", 16 KB alignment there and in the next step.
      - name: Check the on-device engines are in the APK
        run: |
          set -euo pipefail
          apk=dist/mozhi-universal.apk
          entries=$(unzip -l "$apk")
          failed=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for engine in bergamot tesseract whisper; do
              if ! grep -q "lib/$abi/libmozhi_$engine\.so" <<< "$entries"; then
                echo "::error::$apk has no lib/$abi/libmozhi_$engine.so"
                failed=1
              fi
            done
          done
          # Whisper's builds for newer arm64 CPUs (dotprod + FP16, i8mm).
          for variant in dotprod i8mm; do
            if ! grep -q "lib/arm64-v8a/libmozhi_whisper_$variant\.so" <<< "$entries"; then
              echo "::error::$apk has no lib/arm64-v8a/libmozhi_whisper_$variant.so"
              failed=1
            fi
          done
          # ...and only there (the other ABIs build empty stand-ins).
          if grep -qE "lib/(armeabi-v7a|x86_64)/libmozhi_whisper_(dotprod|i8mm)\.so" <<< "$entries"; then
            echo "::error::$apk has a Whisper CPU variant outside arm64-v8a"
            failed=1
          fi
          # On-device AI (llama.cpp): arm64-v8a has the baseline and two CPU
          # variants, x86_64 the baseline, armeabi-v7a nothing (64-bit only).
          for lib in libmozhi_llama libmozhi_llama_dotprod libmozhi_llama_i8mm; do
            if ! grep -q "lib/arm64-v8a/$lib\.so" <<< "$entries"; then
              echo "::error::$apk has no lib/arm64-v8a/$lib.so"
              failed=1
            fi
          done
          if ! grep -q "lib/x86_64/libmozhi_llama\.so" <<< "$entries"; then
            echo "::error::$apk has no lib/x86_64/libmozhi_llama.so"
            failed=1
          fi
          if grep -qE "lib/(armeabi-v7a/libmozhi_llama|x86_64/libmozhi_llama_)" <<< "$entries"; then
            echo "::error::$apk has llama libraries for armeabi-v7a or x86_64 CPU variants"
            failed=1
          fi
          if grep -q 'libc++_shared\.so' <<< "$entries"; then
            echo "::error::$apk contains libc++_shared.so"
            failed=1
          fi
          [ "$failed" = 0 ]

      # Android 15+ phones with 16 KB memory pages only load a native
      # library whose LOAD segments are 16 KB aligned and, stored
      # uncompressed, starts on a 16 KB boundary in the APK. Every
      # 64-bit library as packaged: the engines, Flutter's and the
      # plugins'.
      - name: Check the native libraries for 16 KB pages
        run: python3 tool/check_page_size.py dist/*.apk

      - name: Size report
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            signing="release key"
          else
            signing="debug key (no signing secrets)"
          fi
          {
            echo "### Android APKs (default, no Google code)"
            echo
            echo "Signed with the $signing. tool/check_no_google.sh passed on every APK."
            echo
            echo "| APK | Size |"
            echo "| --- | ---: |"
            for apk in dist/*.apk; do
              size=$(numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c %s "$apk")")
              echo "| \`$(basename "$apk")\` | $size |"
            done
            echo
            echo '```text'
            ls -lh dist
            echo
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozhi-android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Runs the x86_64 release APK on an emulator without Google APIs (like a
  # degoogled phone) the way a new user would: install, open, walk through
  # the first run with its defaults, type a sentence and wait for the
  # translation (tool/android_smoke.py). Fails when Mozhi crashes, stops or
  # never shows its screens; screenshots, the accessibility tree of each
  # step and logcat are uploaded for review.
  android-smoke:
    name: Android emulator smoke test
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mozhi-android
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Mozhi on Android 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          ram-size: 4096M
          disk-size: 6000M
          script: python3 tool/android_smoke.py dist/mozhi-x86_64.apk smoke

      - name: Summarize
        if: ${{ !cancelled() }}
        run: cat smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke
          path: smoke
          if-no-files-found: warn

  # The Play variant: the default app plus Google ML Kit's on-device text
  # recognition (closed source) for camera and image translation, prepared
  # by tool/play_prepare.sh. Keeps that variant analyzing, testing and
  # building. Its APK contains Google code by design, so it is not checked
  # with tool/check_no_google.sh.
  build-play:
    name: Build Play variant (ML Kit)
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # CMake (>= 3.17) reads the compiler launcher from the environment, so
      # the plugin's Gradle externalNativeBuild compiles through ccache.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned sources of every on-device engine (translation, text
      # recognition, voice): only the submodules they compile, then their
      # patches. The Gradle build compiles them; it downloads nothing.
      - name: Fetch the on-device engines' sources
        run: bash tool/fetch_native_deps.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # cache: true caches the Flutter SDK and the pub cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the NDK, CMake and ccache
        run: |
          # Retries Google's downloads, which sometimes arrive broken.
          bash tool/install_native_toolchain.sh
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Restores the newest cache of any Android job (the same sources).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: bergamot-ccache-${{ env.NDK_VERSION }}-play-${{ github.sha }}
          restore-keys: |
            bergamot-ccache-${{ env.NDK_VERSION }}-play-
            bergamot-ccache-${{ env.NDK_VERSION }}-

      # Edits this job's checkout only (pubspec.yaml, the ML Kit overlay
      # from tool/play/, android/app/build.gradle.kts and
      # android/gradle.properties).
      - name: Add ML Kit
        run: |
          sh tool/play_prepare.sh
          sh tool/play_prepare.sh # idempotent: a second run only checks
          git status --short

      - name: Install dependencies
        run: |
          flutter pub get
          bash .github/scripts/packages.sh get
          flutter gen-l10n

      # The overlay is excluded from the default analysis (tool/play/**);
      # here it is in lib/ and test/.
      - name: Analyze
        run: flutter analyze

      - name: Test the ML Kit bindings and image translation
        run: flutter test test/platform/mlkit_bindings_test.dart test/image_translate

      # Without signing secrets the APKs are signed with a debug key. Keep
      # one debug key across runs (GitHub's cache; never published) so a
      # newer test build installs over an older one. Release builds use the
      # release key from the secrets instead.
      - name: Restore the CI debug key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create the CI debug key if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mozhi CI debug,O=Mozhi,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android |
            grep -m1 'SHA256:' | sed 's/^ */Debug key certificate /'

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --flavor production \
            -t lib/main_production.dart 2>&1 | tee build-android.log
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-production-release.apk \
            dist/mozhi-play-universal.apk
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          {
            echo "### Play variant (ML Kit text recognition)"
            echo
            echo '```text'
            ls -lh dist
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize native build errors
        if: failure()
        run: |
          log=build-android.log
          [ -f "$log" ] || exit 0
          {
            echo "### Native build errors"
            echo
            echo "Failed Gradle tasks:"
            echo
            echo '```text'
            grep -E "Execution failed for task|> Task .*(CMake|Cxx).* FAILED" "$log" | sort -u || true
            echo '```'
            echo
            echo "Compiler errors (first 200; the job *Build Bergamot native (Android)* lists all, per ABI):"
            echo
            echo '```text'
            grep -E "(error|fatal error): |^FAILED: " "$log" | sort -u | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozhi-android-play
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # The web app's on-device engine: Mozilla's Bergamot and CLD2 compiled to
  # WebAssembly (single-threaded, WASM SIMD) with Emscripten at the version
  # mozilla/translations pins, by packages/bergamot_translator/tool/
  # build_wasm.sh (only the submodules the engine compiles; emsdk in a
  # cache outside the checkout). The web jobs copy the artifact into
  # web/bergamot/ before `flutter build web`; nothing binary is committed.
  build-bergamot-wasm:
    name: Build Bergamot WASM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOZHI_CACHE_DIR: ${{ github.workspace }}/.mozhi-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the engine's sources
        run: packages/bergamot_translator/tool/fetch_native_deps.sh

      # emsdk is ~1.2 GB unpacked; keyed on the version upstream pins and
      # the emsdk commit of its submodule.
      - name: Find the pinned Emscripten
        id: emsdk
        run: |
          translations=packages/bergamot_translator/native/third_party/translations
          version=$(sed -n 's/^EMSDK_VERSION = "\(.*\)"$/\1/p' \
            "$translations/inference/scripts/build-wasm.py")
          commit=$(git -C "$translations" ls-tree HEAD inference/3rd_party/emsdk \
            | awk '{print $3}')
          echo "key=emsdk-${{ runner.os }}-$version-$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mozhi-cache/emsdk
          key: ${{ steps.emsdk.outputs.key }}

      - name: Build bergamot-translator.{js,wasm}
        run: |
          packages/bergamot_translator/tool/build_wasm.sh "$RUNNER_TEMP/bergamot-wasm"
          {
            echo "### Bergamot WASM"
            echo
            echo "| File | Size | gzip |"
            echo "| --- | ---: | ---: |"
            for file in "$RUNNER_TEMP"/bergamot-wasm/bergamot-translator.*; do
              echo "| $(basename "$file") | $(stat -c %s "$file") | $(gzip -9c "$file" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bergamot-wasm
          path: |
            ${{ runner.temp }}/bergamot-wasm/bergamot-translator.js
            ${{ runner.temp }}/bergamot-wasm/bergamot-translator.wasm
          if-no-files-found: error

  build-web:
    name: Build web
    needs: [analyze-test, build-bergamot-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The on-device engine (job build-bergamot-wasm) next to its worker,
      # so the build copies it into build/web/bergamot/.
      - name: Add the Bergamot WASM engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bergamot-wasm
          path: web/bergamot

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build
        run: |
          # --no-web-resources-cdn: serve CanvasKit from the build itself
          # instead of Google's CDN (no third-party request on start).
          flutter build web --release -t lib/main_production.dart \
            --base-href "$WEB_BASE_HREF" --no-web-resources-cdn

      # The engine's fallback fonts (CJK, Indic, Arabic, emoji...) come
      # from the build too instead of fonts.gstatic.com (docs/building.md).
      - name: Self-host the fallback fonts
        run: |
          python3 tool/web_fallback_fonts_test.py
          python3 tool/web_fallback_fonts.py build/web

      # The list of the build's files (sizes and SHA-256) that the app shell
      # service worker (web/mozhi_sw.js) keeps for offline use, stamped into
      # the worker. Last: it lists what the steps above put in the build.
      - name: List the app shell's files
        run: |
          python3 tool/web_shell_manifest.py build/web
          {
            echo "### Web build"
            echo
            echo "Base href \`$WEB_BASE_HREF\`, total size $(du -sh build/web | cut -f1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mozhi-web
          path: build/web
          if-no-files-found: error

  # Browser end-to-end tests (e2e/, Playwright + Chromium) against a web
  # build of the development flavor served from /, with e2e/mock_server.py
  # standing in for a Mozhi instance and an AI provider. Playwright starts
  # both servers itself (python3 -m http.server and the mock; see
  # e2e/playwright.config.js).
  e2e-web:
    name: Web end-to-end tests
    needs: [analyze-test, build-bergamot-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WEB_DIR: ../build/web-e2e
      # Real German models for the on-device spec (offline_engine.spec.js),
      # fetched from Mozilla and checked against the bundled catalog.
      E2E_MODELS_DIR: ${{ github.workspace }}/.e2e-models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Add the Bergamot WASM engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bergamot-wasm
          path: web/bergamot

      # 51 MB (de-en and en-de), cached by the catalog's checksums.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-models
          key: e2e-models-de-${{ hashFiles('packages/bergamot_translator/assets/catalog.json') }}

      - name: Fetch the test models
        run: python3 e2e/fetch_models.py de "$E2E_MODELS_DIR"

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build web (development flavor)
        run: |
          flutter build web --release -t lib/main_development.dart \
            --no-web-resources-cdn --base-href / -o build/web-e2e
          # Like the release: fallback fonts from the build, not Google,
          # then the app shell's files (offline_shell.spec.js).
          python3 tool/web_fallback_fonts.py build/web-e2e
          python3 tool/web_shell_manifest.py build/web-e2e

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      # The accessibility snapshot of each failed test, in the log itself:
      # readable without downloading the report.
      - name: Print the failed tests' page snapshots
        if: failure()
        working-directory: e2e
        run: |
          find test-results -name error-context.md -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              echo "::group::$file"
              cat "$file"
              echo "::endgroup::"
            done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  # The data the app downloads (Whisper models from Hugging Face, Tesseract
  # language data from GitHub) must still be served with the sizes the
  # bundled catalogues pin: the app rejects any other file. HEAD requests
  # only; nothing is downloaded (except the quantized Whisper models,
  # hashed once to resolve their catalogue entries, about 0.8 GB).
  check-model-downloads:
    name: Check model downloads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the served sizes with the catalogues
        run: python3 tool/check_model_downloads.py

      # A new install translates online through the volunteer Mozhi
      # servers built into the app: list which still translate, with which
      # engines (job summary; a warning per server that no longer does).
      # Fails only when none translates with the default engine.
      - name: Check the public Mozhi instances
        if: ${{ !cancelled() }}
        run: python3 tool/check_public_instances.py

      # The on-device AI models (packages/llama_engine/assets/models.json)
      # come from Hugging Face's API, which only CI can reach: print the
      # catalogue resolved from tool/llm_catalog.json (commit-pinned URLs,
      # sizes, SHA-256) for a maintainer to commit, then check the
      # committed one is still served as it says. Models already committed
      # keep their files; a warning says when Hugging Face now resolves
      # another file (resolve --update <id> takes it).
      - name: Resolve the on-device AI catalogue
        if: ${{ !cancelled() }}
        run: python3 tool/llm_catalog.py resolve --print

      - name: Check the on-device AI downloads
        if: ${{ !cancelled() }}
        run: python3 tool/llm_catalog.py check

      # The quantized Whisper models (base and small q5_1, large-v3-turbo
      # q5_0) for packages/whisper_speech/assets/models.json: pinned to
      # Hugging Face's current commit, size and SHA-256 from its API, SHA-1
      # from the downloaded files. Printed for a maintainer to commit
      # (`resolve --write` does it where Hugging Face is reachable).
      - name: Resolve the quantized Whisper models
        if: ${{ !cancelled() }}
        run: python3 tool/whisper_catalog.py resolve --print

  # The on-device engines' native libraries for the three release ABIs,
  # built exactly like the plugins' Gradle builds do (same NDK, CMake,
  # toolchain file and arguments; see packages/<engine>/android/build.gradle):
  #   libmozhi_bergamot.so   offline translation (Mozilla's Firefox
  #                          Translations engine)
  #   libmozhi_tesseract.so  text recognition in photos (Tesseract)
  #   libmozhi_whisper.so    offline voice input (whisper.cpp; arm64-v8a
  #                          also libmozhi_whisper_dotprod.so and
  #                          libmozhi_whisper_i8mm.so for newer CPUs)
  #   libmozhi_llama.so      on-device AI (llama.cpp; arm64-v8a and x86_64
  #                          only, arm64-v8a also libmozhi_llama_dotprod.so
  #                          and libmozhi_llama_i8mm.so for newer CPUs)
  # The APK jobs build them again through Gradle; this job exists for
  # diagnostics: it needs nothing else, so it starts at once, keeps going
  # after compile errors (ninja -k 0, every ABI) so one run lists all of
  # them, prints a per-ABI summary, checks exports, dependencies and 16 KB
  # alignment, and uploads the libraries and each engine's CLI (for adb
  # shell).
  build-native-android:
    name: Build ${{ matrix.title }} native (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: bergamot
            title: Bergamot
            package: packages/bergamot_translator
            # The C API (mozhi_bergamot_<name>).
            exports: >-
              abi_version version model_create model_destroy translate
              translate_pivot free_string last_error detect
            # Stable NDK system libraries (libandroid: cpuinfo on arm64).
            needed: libc.so libm.so libdl.so liblog.so libandroid.so
          - engine: tesseract
            title: Tesseract
            package: packages/tesseract_ocr
            exports: >-
              abi_version version create destroy recognize free_string
              last_error
            needed: libc.so libm.so libdl.so
          - engine: whisper
            title: Whisper
            package: packages/whisper_speech
            exports: >-
              abi_version version model_load model_free model_is_multilingual
              transcribe cancel free_string last_error vad_load vad_free
              vad_frame_size vad_process vad_reset
            # liblog: assertion messages go to logcat.
            needed: libc.so libm.so libdl.so liblog.so
            # arm64-v8a also builds libmozhi_whisper_<variant>.so (and its
            # CLI) for newer CPUs: dotprod + FP16, and i8mm.
            variants: dotprod i8mm
          - engine: llama
            title: llama
            package: packages/llama_engine
            exports: >-
              abi_version version cpu_features json_grammar model_load
              model_free model_info chat_format chat_tokenize tokenize_count
              chat_generate_begin generate_begin generate_next generate_end
              generate_stats cancel free_string last_error
            # liblog: assertion messages go to logcat.
            needed: libc.so libm.so libdl.so liblog.so
            # arm64-v8a also builds libmozhi_llama_<variant>.so (and its CLI)
            # for newer CPUs: dotprod + FP16, and i8mm.
            variants: dotprod i8mm
            # 64-bit only: no armeabi-v7a build.
            abis: arm64-v8a x86_64
    env:
      ANDROID_PLATFORM: android-24
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
      ENGINE: ${{ matrix.engine }}
      TITLE: ${{ matrix.title }}
      PACKAGE: ${{ matrix.package }}
      EXPORTS: ${{ matrix.exports }}
      NEEDED: ${{ matrix.needed }}
      VARIANTS: ${{ matrix.variants }}
      ABIS: ${{ matrix.abis || 'arm64-v8a armeabi-v7a x86_64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the submodules the engine compiles, then its native/patches/.
      - name: Fetch the pinned engine sources
        run: bash "$PACKAGE/tool/fetch_native_deps.sh"

      - name: Install the NDK, CMake and ccache
        run: |
          # Retries Google's downloads, which sometimes arrive broken.
          bash tool/install_native_toolchain.sh
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          # The SDK's CMake package also contains ninja.
          echo "$sdk/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ matrix.engine }}-ccache-${{ env.NDK_VERSION }}-native-${{ github.sha }}
          restore-keys: |
            ${{ matrix.engine }}-ccache-${{ env.NDK_VERSION }}-native-
            ${{ matrix.engine }}-ccache-${{ env.NDK_VERSION }}-

      # Every ABI is configured and built even when another one fails, and
      # ninja keeps going after errors (-k 0), so a single run reports all
      # compile errors. The step fails at the end if any ABI failed.
      - name: Build ${{ env.ABIS }}
        run: |
          # GitHub runs steps with bash -e: turn it off, every ABI must be
          # attempted and the step decides at the end (exit "$failed").
          set +e -uo pipefail
          cmake --version | head -1
          native="$PACKAGE/native"
          logs="$RUNNER_TEMP/$ENGINE-logs"
          mkdir -p "$logs" dist
          : > "$RUNNER_TEMP/$ENGINE-built"
          : > "$RUNNER_TEMP/$ENGINE-failed"
          failed=0
          {
            echo "### $TITLE native build (NDK $NDK_VERSION)"
            echo
            echo "| ABI | Configure | Build | Compile errors |"
            echo "| --- | --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          for abi in $ABIS; do
            echo "::group::$abi"
            build="$RUNNER_TEMP/$ENGINE-$abi"
            configure=failed
            result=skipped
            if cmake -S "$native" -B "$build" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
              -DANDROID_STL=c++_static \
              -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee "$logs/$abi-configure.log"; then
              configure=ok
              # arm64-v8a: also the CPU variants (libmozhi_<engine>_<variant>.so).
              targets=("mozhi_$ENGINE" "mozhi_${ENGINE}_cli")
              if [ "$abi" = arm64-v8a ]; then
                for variant in $VARIANTS; do
                  targets+=("mozhi_${ENGINE}_$variant" "mozhi_${ENGINE}_${variant}_cli")
                done
              fi
              if cmake --build "$build" --target "${targets[@]}" \
                --parallel -- -k 0 2>&1 | tee "$logs/$abi-build.log"; then
                result=ok
                mkdir -p "dist/$abi"
                for target in "${targets[@]}"; do
                  case "$target" in
                    *_cli) cp "$build/$target" "dist/$abi/" ;;
                    *) cp "$build/lib$target.so" "dist/$abi/" ;;
                  esac
                done
                echo "$abi" >> "$RUNNER_TEMP/$ENGINE-built"
              else
                result=failed
              fi
            fi
            # `|| true`: the step shell runs with -e and pipefail, and grep
            # exits 1 when a clean build has no errors to count.
            errors=$(cat "$logs/$abi-configure.log" "$logs/$abi-build.log" 2>/dev/null |
              { grep -E '(error|fatal error): |CMake Error' || true; } | sort -u | wc -l)
            echo "::endgroup::"
            if [ "$configure" != ok ] || [ "$result" != ok ]; then
              failed=1
              echo "::error title=$TITLE $abi::configure $configure, build $result, $errors compile errors"
              # Every distinct error once, annotated, so the run page lists them.
              cat "$logs/$abi-configure.log" "$logs/$abi-build.log" 2>/dev/null |
                grep -E '(error|fatal error): |CMake Error' | sort -u | head -n 50 |
                sed "s/^/::error title=$TITLE $abi::/" || true
            fi
            echo "| $abi | $configure | $result | $errors |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != ok ]; then echo "$abi" >> "$RUNNER_TEMP/$ENGINE-failed"; fi
          done
          ccache --show-stats || true
          if [ "$failed" != 0 ]; then
            {
              echo
              echo "#### Errors (each once, per ABI)"
              for abi in $(cat "$RUNNER_TEMP/$ENGINE-failed"); do
                echo
                echo "**$abi**"
                echo
                echo '```text'
                cat "$logs/$abi-configure.log" "$logs/$abi-build.log" 2>/dev/null |
                  grep -E '(error|fatal error): |CMake Error|^FAILED: ' | sort -u | head -n 200 || true
                echo '```'
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.engine }}-android-logs
          path: ${{ runner.temp }}/${{ matrix.engine }}-logs
          if-no-files-found: ignore
          retention-days: 14

      # Only the C API may be exported, libc++ must be static (no
      # libc++_shared.so in the APK), and LOAD segments 16 KB aligned.
      # Checks every ABI that built, also when another one failed.
      - name: Check the libraries
        if: always()
        run: |
          set -euo pipefail
          bin="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          failed=0
          {
            echo "### $TITLE native libraries"
            echo
            echo "| ABI | Library | Unstripped | Stripped |"
            echo "| --- | --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          built=$(cat "$RUNNER_TEMP/$ENGINE-built" 2>/dev/null || true)
          [ -n "$built" ] || { echo "No ABI built."; exit 1; }
          size() { numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c %s "$1")"; }
          for abi in $built; do
            # libmozhi_<engine>.so and its CPU variants (arm64-v8a).
            for lib in "dist/$abi/libmozhi_$ENGINE"*.so; do
              name=$(basename "$lib" .so)
              case "$name" in *.stripped) continue ;; esac
              exports=$("$bin/llvm-nm" -D --defined-only "$lib" | awk '{print $NF}' | sort)
              unexpected=$(printf '%s\n' "$exports" | grep -v "^mozhi_${ENGINE}_" || true)
              if [ -n "$unexpected" ]; then
                echo "::error::$abi $name exports more than the C API: $unexpected"
                failed=1
              fi
              for symbol in $EXPORTS; do
                if ! grep -qx "mozhi_${ENGINE}_$symbol" <<< "$exports"; then
                  echo "::error::$abi $name does not export mozhi_${ENGINE}_$symbol"
                  failed=1
                fi
              done
              for needed in $("$bin/llvm-readelf" -d "$lib" |
                sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
                if ! grep -qwF -- "$needed" <<< "$NEEDED"; then
                  echo "::error::$abi $name needs $needed"
                  failed=1
                fi
              done
              if "$bin/llvm-readelf" -lW "$lib" |
                awk '$1 == "LOAD" && $NF != "0x4000" { bad = 1 } END { exit !bad }'; then
                echo "::error::$abi $name has LOAD segments that are not 16 KB aligned"
                failed=1
              fi
              "$bin/llvm-strip" --strip-unneeded -o "dist/$abi/$name.stripped.so" "$lib"
              echo "| $abi | $name | $(size "$lib") | $(size "dist/$abi/$name.stripped.so") |" \
                >> "$GITHUB_STEP_SUMMARY"
            done
          done
          (cd dist && sha256sum -- */*.so > SHA256SUMS.txt)
          [ "$failed" = 0 ] || exit 1

      - name: Upload libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.engine }}-android-native
          path: dist
          if-no-files-found: error
