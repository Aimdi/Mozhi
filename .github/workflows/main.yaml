name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          for package in packages/*/; do
            (cd "$package" && dart pub get)
          done

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          find lib test packages -name '*.dart' \
            -not -path 'lib/l10n/gen/*' \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Bloc lint
        run: dart run bloc_tools:bloc lint lib

      - name: Test packages
        run: |
          for package in packages/*/; do
            echo "::group::$package"
            (cd "$package" && dart test)
            echo "::endgroup::"
          done

      - name: Test app
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android APKs
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Optional: without these secrets the release APKs are signed with the
      # debug key (fine for testing, but they cannot update each other).
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p dist

          # One APK per ABI (smaller downloads).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-production-release.apk" "dist/mozhi-$abi.apk"
          done

          # Universal APK (all ABIs).
          flutter build apk --release --flavor production \
            -t lib/main_production.dart
          cp "$out/app-production-release.apk" dist/mozhi-universal.apk

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mozhi-android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-web:
    name: Build web
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build
        run: flutter build web --release -t lib/main_production.dart --base-href /Mozhi/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: mozhi-web
          path: build/web
          if-no-files-found: error
