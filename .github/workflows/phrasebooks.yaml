name: phrasebooks

# Builds the app's starter phrasebooks from English Wikivoyage's phrasebook
# articles (MediaWiki API, at pinned revisions when given) and publishes
# them as a GitHub release named phrasebooks-<date>, with
# phrasebook_catalog.json (sizes and SHA-256 of every pack). Owner-run only
# (Actions tab > phrasebooks > Run workflow). Afterwards commit the
# catalogue into the app:
#   python3 tool/phrasebooks.py dart phrasebook_catalog.json \
#     > lib/phrasebook/data/starter_catalog_data.dart
# (the release also carries that file). See docs/phrasebook.md.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: App language codes to build, comma separated (tool/phrasebooks.py pages)
        required: true
        type: string
        default: "pt,es,fr,de,it,nl,el,tr,pl,cs,hu,ro,ru,uk,ja,zh,ko,th,vi,id,hi,ar,he,sv,da,no,fi,hr,sw"
      revisions:
        description: >-
          Optional pinned revisions, "pt=1234567,es=2345678"; languages
          without a pin use the latest revision (recorded in the pack)
        required: false
        type: string
      draft:
        description: Publish the release as a draft
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the phrasebook builder
        run: python3 tool/phrasebooks_test.py

      - id: plan
        name: Languages and date
        env:
          LANGUAGES: ${{ inputs.languages }}
          REVISIONS: ${{ inputs.revisions }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          sys.path.insert(0, 'tool')
          import phrasebooks
          codes = [c.strip() for c in os.environ['LANGUAGES'].split(',') if c.strip()]
          for code in codes:
              if code not in phrasebooks.PAGES:
                  sys.exit(f'::error::No Wikivoyage page for {code!r} (tool/phrasebooks.py PAGES)')
          for pin in filter(None, (p.strip() for p in os.environ.get('REVISIONS', '').split(','))):
              if not re.fullmatch(r'[a-z]{2,3}=[0-9]+', pin):
                  sys.exit(f'::error::{pin!r} is not a pin like pt=1234567')
          EOF
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch the pages and build the packs
        env:
          LANGUAGES: ${{ inputs.languages }}
          REVISIONS: ${{ inputs.revisions }}
          RETRIEVED: ${{ steps.plan.outputs.date }}
        run: |
          mkdir -p dist pages
          failed=""
          for language in $(printf '%s' "$LANGUAGES" | tr ',' ' '); do
            pin=$(printf '%s' "$REVISIONS" | tr ',' '\n' | sed -n "s/^ *$language=//p" | tr -d ' ')
            echo "::group::$language ${pin:+(revision $pin)}"
            if python3 tool/phrasebooks.py fetch "$language" ${pin:+--revision "$pin"} \
                --output "pages/$language.page.json" &&
               python3 tool/phrasebooks.py build "pages/$language.page.json" \
                --language "$language" --retrieved "$RETRIEVED" \
                --output "dist/$language.json.gz" --stats "dist/$language.stats.json"; then
              python3 tool/phrasebooks.py dump "dist/$language.json.gz" | head -20
            else
              echo "::warning::$language failed"
              failed="$failed $language"
              rm -f "dist/$language.json.gz" "dist/$language.stats.json"
            fi
            echo "::endgroup::"
            # The API's etiquette: one request at a time, not too fast.
            sleep 1
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phrasebooks
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: phrasebooks-${{ needs.build.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phrasebooks
          path: dist

      - name: Catalogue and checksums
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          shopt -s nullglob
          packs=(dist/*.json.gz)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "::error::No phrasebook was built."
            exit 1
          fi
          python3 tool/phrasebooks.py catalog "${packs[@]}" \
            --release "$TAG" \
            --base-url "$SERVER/$REPOSITORY/releases/download/$TAG" \
            --source "$SERVER/$REPOSITORY/releases/tag/$TAG" \
            > dist/phrasebook_catalog.json
          python3 tool/phrasebooks.py dart dist/phrasebook_catalog.json \
            > dist/starter_catalog_data.dart
          (cd dist && sha256sum -- *.json.gz phrasebook_catalog.json > SHA256SUMS.txt)
          {
            echo "## Starter phrasebooks $TAG"
            echo
            echo "| Language | Revision | Phrases | With pronunciation | Size | SHA-256 |"
            echo "| --- | ---: | ---: | ---: | ---: | --- |"
            python3 - dist/*.stats.json <<'EOF'
          import json, sys
          for path in sys.argv[1:]:
              with open(path) as f:
                  s = json.load(f)
              print(f"| {s['name']} ({s['language']}) | {s['revision']} | {s['phrases']:,} "
                    f"| {s['pronunciations']:,} | {s['size'] / 1024:.1f} KB | `{s['sha256'][:16]}` |")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Starter phrasebooks ${{ needs.build.outputs.date }}
          draft: ${{ inputs.draft }}
          prerelease: true
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Starter phrasebooks for Mozhi, built by `.github/workflows/phrasebooks.yaml` from English Wikivoyage's phrasebook articles (the revision of each is in its pack and in the summary of the run). Format and use: `docs/phrasebook.md`.

            - **Licence**: the text is from Wikivoyage (https://www.wikivoyage.org/), by Wikivoyage contributors, under the Creative Commons Attribution-ShareAlike 4.0 licence (https://creativecommons.org/licenses/by-sa/4.0/); shortened to each article's phrase list (the phrases, their translations and pronunciations). Every pack carries this attribution with links to its page, revision and authors, and the app shows it.
            - **App**: commit `starter_catalog_data.dart` as `lib/phrasebook/data/starter_catalog_data.dart`; the app then offers these phrasebooks under Phrasebook > Starter phrasebooks and checks every download against its size and SHA-256.
            - Verify downloads against `SHA256SUMS.txt`.
          files: |
            dist/*.json.gz
            dist/phrasebook_catalog.json
            dist/starter_catalog_data.dart
            dist/SHA256SUMS.txt
