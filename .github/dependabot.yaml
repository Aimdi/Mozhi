# Dependabot version updates, weekly (Mondays). Minor and patch updates are
# grouped into one pull request per ecosystem; major updates come one by one
# so each can be reviewed on its own. Pull requests target the default
# branch. See docs/release.md, "Dependency updates".
#
# Not covered on purpose: the native engines' git submodules
# (packages/*/native/third_party). Bump them by hand: patches in
# native/patches/ must still apply (docs/building.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The app and every package (each resolves on its own in CI). Only the
  # root pubspec.lock is committed; for the packages Dependabot updates the
  # constraints in pubspec.yaml.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/packages/bergamot_translator"
      - "/packages/llm_api"
      - "/packages/mlkit_translator"
      - "/packages/mozhi_api"
      - "/packages/mozhi_cli"
      - "/packages/mt_api"
      - "/packages/tesseract_ocr"
      - "/packages/translation_repository"
      - "/packages/whisper_speech"
    schedule:
      interval: "weekly"
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # record 7 needs record_android 2, built for Android Gradle Plugin 9;
      # the app is on AGP 8 (see pubspec.yaml).
      - dependency-name: "record"
        versions: [">=7.0.0"]

  # The app's Android build and the on-device engines' plugin builds. Keep
  # the Android Gradle Plugin the same in all of them, and Gradle, AGP and
  # Kotlin within the range Flutter supports (flutter build apk warns
  # otherwise).
  - package-ecosystem: "gradle"
    directories:
      - "/android"
      - "/packages/bergamot_translator/android"
      - "/packages/tesseract_ocr/android"
      - "/packages/whisper_speech/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Gradle 9.6+ removed an internal API the Android Gradle Plugin 8
      # uses; move to AGP 9 first (docs/release.md).
      - dependency-name: "gradle-wrapper"
        versions: [">=9.6.0"]
