name: mozhi
description: "A fast, private translator. Client for Mozhi instances plus AI/LLM translation."
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  dynamic_color: ^2.1.0
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  llm_api:
    path: packages/llm_api
  material_ui: ^1.1.1
  mlkit_translator:
    path: packages/mlkit_translator
  mozhi_api:
    path: packages/mozhi_api
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  translation_repository:
    path: packages/translation_repository
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
