name: mozhi
description: "A fast, private translator. Client for Mozhi instances plus AI/LLM translation."
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  audioplayers: ^6.8.1
  bergamot_translator:
    path: packages/bergamot_translator
  bloc: ^9.2.1
  cryptography: ^2.9.0
  dynamic_color: ^2.1.0
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  llm_api:
    path: packages/llm_api
  material_ui: ^1.7.0
  mozhi_api:
    path: packages/mozhi_api
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  # 6.x: record 7 needs record_android 2, which is built for Android Gradle
  # Plugin 9 (built-in Kotlin); the app is on AGP 8.
  record: ^6.2.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  tesseract_ocr:
    path: packages/tesseract_ocr
  translation_repository:
    path: packages/translation_repository
  url_launcher: ^6.3.3
  whisper_speech:
    path: packages/whisper_speech

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  path: ^1.9.1
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
