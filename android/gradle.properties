org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The default build excludes Google ML Kit, Play services, Firebase and data
# transport (android/app/build.gradle.kts). tool/play_prepare.sh appends
# noMlkit=false here for the Play variant (ML Kit text recognition).

# AGP 9 defaults that Flutter's Gradle plugin and the plugins' build files
# don't support yet (they use the old variant API and apply the Kotlin plugin
# themselves). Flutter's app template sets both, and `flutter build` adds them
# when they are missing.
android.newDsl=false
android.builtInKotlin=false
